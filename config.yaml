# Experiment configuration for the tiered-deconfliction paper.
seed: 1
seeds: [1, 2, 3]
typical_extra: 0
random_sizes: [20, 40, 60, 80]
main_size: 40
main_seeds: [1, 2, 3]
max_block_adjustments: 3
max_rounds: 3
max_steps_factor: 6

llm:
  provider: deepseek
  model: deepseek-chat
  base_url: https://api.deepseek.com
  temperature: 0.0
  max_tokens: 1024
  api_key_env: DEEPSEEK_API_KEY
  cache: results/llm-cache.jsonl
  transcript: results/llm-transcript.jsonl

paths:
  results: results
  figures: ../figures

scenarios:
  typical: typical-s0
  random_prefix: random-n

methods:
  sequential:
    mode: sequential
    use_llm: false
  rule-only:
    mode: rule-only
    use_llm: false
  rule-arbitration:
    mode: rule-arbitration
    use_llm: false
  arbitration-only:
    mode: arbitration-only
    use_llm: false
  tiered-det:
    mode: tiered
    use_llm: false
  tiered-llm:
    mode: tiered
    use_llm: true
